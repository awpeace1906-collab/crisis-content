name: Build content + staleness check

on:
  push:
    branches: [main]
    paths:
      - 'Protocols/**'
      - 'Procedures/**'
      - 'scripts/**'
  schedule:
    # Daily, independent of any content push — this is what catches an item
    # crossing its reviewDue date purely because time passed, with nobody
    # having touched the repo. See scripts/check-staleness.mjs.
    - cron: '17 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Extract content + write manifest
        run: npm run build

      - name: Commit updated dist/ if changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: rebuild content bundle [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Purge jsDelivr cache
        # Observed live (2026-08-31): purging immediately after push can race
        # GitHub's own propagation of the new commit to raw.githubusercontent.com
        # — jsDelivr's purge triggers an immediate origin re-fetch, and if that
        # lands before raw.githubusercontent.com has the new content, it
        # re-caches the *old* version and the purge looks like it worked but
        # didn't. Purge twice, a few seconds apart, so the second pass catches
        # it even if the first raced. Belt-and-suspenders, not a real fix for
        # the underlying race — a manual purge is always the fallback if
        # content still looks stale a few minutes after a push.
        if: steps.commit.outputs.changed == 'true'
        run: |
          purge() {
            for f in protocols.json procedures.json envenomation.json manifest.json; do
              curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dist/$f" || true
            done
          }
          purge
          sleep 15
          purge

      - name: Staleness check
        id: staleness
        run: npm run check-staleness

      - name: Sync staleness issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('node:child_process');
            let report = '';
            try {
              report = execSync('node scripts/check-staleness.mjs').toString();
            } catch (err) {
              report = (err.stdout?.toString() || '') + (err.stderr?.toString() || '');
            }
            const overdueTier1 = /Tier 1 item\(s\) overdue/.test(report);
            const label = 'content-staleness';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues[0];

            if (!overdueTier1) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  body: 'No Tier 1 items overdue as of this run — closing.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }

            const body = `Automated staleness check found overdue content:\n\n\`\`\`\n${report}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Content staleness: Tier 1 item(s) overdue',
                body, labels: [label],
              });
            }
