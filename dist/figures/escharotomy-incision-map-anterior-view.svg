<svg viewBox="0 0 520 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escharotomy incision map, anterior view. Limb incisions run mid-medial and mid-lateral along both sides of each arm and leg, the full length of the burn and across every joint, ending one to two centimeters into unburned skin. The chest release is a rectangular shield: bilateral anterior axillary lines joined by transverse incisions along the clavicles and along the costal margin. Two nerves change the line. At the elbow the medial incision passes anterior to the medial epicondyle, because the ulnar nerve lies subcutaneously behind it. At the knee the lateral incision passes clear of the fibular neck, where the common peroneal nerve wraps around it and division causes a permanent foot drop. Hand incisions run dorsally between the metacarpals and digital incisions are mid-axial, off the pinch surface.">
<style>
  .h{fill:#e8edf5;font-family:Syne,sans-serif;font-weight:700;font-size:14px}
  .s{fill:#8a9ab5;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .t{fill:#e8edf5;font-family:Syne,sans-serif;font-weight:700;font-size:17px}
  .c{fill:#4a5670;font-family:'IBM Plex Mono',monospace;font-size:10.5px}
  .body{fill:#182030;stroke:#8a9ab5;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .limb{fill:none;stroke:#182030;stroke-linejoin:round;stroke-linecap:round}
  .limbe{fill:none;stroke:#8a9ab5;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .inc{fill:none;stroke:#00d4aa;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
  .ld{stroke:#4a5670;stroke-width:1}
</style>

<text class="t" x="0" y="17">Escharotomy incision map</text>
<text class="c" x="0" y="34">Mid-medial and mid-lateral. Two nerves change the line.</text>

<!-- limbs drawn as thick strokes: fill layer then outline -->
<polyline class="limb" stroke-width="26" points="142,134 102,206 90,278"></polyline>
<polyline class="limb" stroke-width="26" points="218,134 258,206 270,278"></polyline>
<polyline class="limb" stroke-width="32" points="160,294 154,364 148,492"></polyline>
<polyline class="limb" stroke-width="32" points="200,294 206,364 212,492"></polyline>
<polyline class="limbe" stroke-width="26" points="142,134 102,206 90,278" opacity="0.55"></polyline>
<polyline class="limbe" stroke-width="26" points="218,134 258,206 270,278" opacity="0.55"></polyline>
<polyline class="limbe" stroke-width="32" points="160,294 154,364 148,492" opacity="0.55"></polyline>
<polyline class="limbe" stroke-width="32" points="200,294 206,364 212,492" opacity="0.55"></polyline>

<!-- head, neck, torso, pelvis, hands, feet -->
<circle class="body" cx="180" cy="86" r="22"></circle>
<rect class="body" x="170" y="104" width="20" height="20"></rect>
<rect class="body" x="138" y="120" width="84" height="152" rx="14"></rect>
<rect class="body" x="142" y="264" width="76" height="34" rx="10"></rect>
<circle class="body" cx="86" cy="286" r="11"></circle>
<circle class="body" cx="274" cy="286" r="11"></circle>
<ellipse class="body" cx="144" cy="500" rx="15" ry="9"></ellipse>
<ellipse class="body" cx="216" cy="500" rx="15" ry="9"></ellipse>

<!-- INCISION LINES -->
<polyline class="inc" points="133,134 93,206 81,278"></polyline>
<polyline class="inc" points="151,134 111,206 99,278"></polyline>
<polyline class="inc" points="227,134 267,206 279,278"></polyline>
<polyline class="inc" points="209,134 249,206 261,278"></polyline>
<polyline class="inc" points="148,294 142,364 136,492"></polyline>
<polyline class="inc" points="172,294 166,364 160,492"></polyline>
<polyline class="inc" points="212,294 218,364 224,492"></polyline>
<polyline class="inc" points="188,294 194,364 200,492"></polyline>
<!-- dorsal hand incisions -->
<polyline class="inc" stroke-width="2" points="82,277 80,295"></polyline>
<polyline class="inc" stroke-width="2" points="91,277 89,295"></polyline>
<polyline class="inc" stroke-width="2" points="270,277 268,295"></polyline>
<polyline class="inc" stroke-width="2" points="279,277 277,295"></polyline>
<!-- chest shield -->
<polyline class="inc" points="146,140 214,140 214,252 146,252 146,140"></polyline>

<!-- nerve hazards -->
<circle cx="249" cy="206" r="6" fill="#f59e0b"></circle>
<line class="ld" x1="316" y1="244" x2="254" y2="210" stroke="#f59e0b" opacity="0.7"></line>
<circle cx="219" cy="378" r="6" fill="#f59e0b"></circle>
<line class="ld" x1="316" y1="378" x2="226" y2="378" stroke="#f59e0b" opacity="0.7"></line>

<!-- right column -->
<text class="s" x="320" y="84" style="fill:#00d4aa">MID-MEDIAL + MID-LATERAL</text>
<text class="c" x="320" y="100">Both lines, the full length</text>
<text class="c" x="320" y="114">of the burn, across every</text>
<text class="c" x="320" y="128">joint, ending 1–2 cm into</text>
<text class="c" x="320" y="142">unburned skin.</text>

<text class="s" x="320" y="172" style="fill:#00d4aa">CHEST SHIELD</text>
<line class="ld" x1="316" y1="168" x2="220" y2="152"></line>
<text class="c" x="320" y="188">Anterior axillary lines,</text>
<text class="c" x="320" y="202">joined at the clavicle</text>
<text class="c" x="320" y="216">and the costal margin.</text>

<text class="s" x="320" y="250" style="fill:#f59e0b">ULNAR NERVE</text>
<text class="c" x="320" y="266" style="fill:#f59e0b">Medial line passes</text>
<text class="c" x="320" y="280" style="fill:#f59e0b">ANTERIOR to the</text>
<text class="c" x="320" y="294" style="fill:#f59e0b">medial epicondyle.</text>

<text class="s" x="320" y="330" style="fill:#f59e0b">COMMON PERONEAL</text>
<text class="c" x="320" y="346" style="fill:#f59e0b">Lateral line passes clear</text>
<text class="c" x="320" y="360" style="fill:#f59e0b">of the fibular neck.</text>
<text class="c" x="320" y="374" style="fill:#f59e0b">Division is a permanent</text>
<text class="c" x="320" y="388" style="fill:#f59e0b">foot drop.</text>

<!-- left column -->
<line class="ld" x1="36" y1="300" x2="74" y2="292"></line>
<text class="s" x="0" y="304">HAND</text>
<text class="c" x="0" y="320">Dorsal, between</text>
<text class="c" x="0" y="334">the metacarpals.</text>
<text class="s" x="0" y="364">DIGITS</text>
<text class="c" x="0" y="380">Mid-axial, off the</text>
<text class="c" x="0" y="394">pinch surface.</text>

<text class="s" x="0" y="526" style="fill:#00d4aa">Endpoint: the edges spring apart and fat bulges.</text>
<text class="c" x="0" y="544">Stop at the fat. Cutting fascia is a fasciotomy — a different procedure.</text>
</svg>