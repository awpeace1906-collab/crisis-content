<svg viewBox="0 0 520 606" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The shoulder dystocia escalation sequence against a clock, about thirty seconds per maneuver. Call for help and start the clock. McRoberts, hyperflexing the hips. Suprapubic pressure, directed down and toward the fetal chest. Episiotomy if needed, for access rather than space. Internal rotation using Rubin two and Woods together as a screw. Delivery of the posterior arm, the highest yield maneuver, which reduces the shoulder diameter by about twenty percent. All fours. Then the last resorts: Zavanelli, cleidotomy, symphysiotomy. Two warnings sit alongside: never apply fundal pressure, which drives the shoulder harder onto the bone and ruptures the uterus, and never pull hard or twist the head, because traction stretches the brachial plexus. Fetal pH falls about zero point zero four units per minute from the moment the head delivers, and past five minutes the risk of hypoxic-ischemic injury climbs steeply. Working the whole sequence once takes about four minutes.">
<style>
  .s{fill:#8a9ab5;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .t{fill:#e8edf5;font-family:Syne,sans-serif;font-weight:700;font-size:17px}
  .c{fill:#4a5670;font-family:'IBM Plex Mono',monospace;font-size:10.5px}
  .rn{fill:#e8edf5;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px}
  .rung{fill:#182030;stroke-width:2}
  .ax{stroke:#4a5670;stroke-width:1.4}
</style>

<text class="t" x="0" y="17">Shoulder dystocia — the sequence, on a clock</text>
<text class="c" x="0" y="34">About 30 seconds per maneuver. Move on; do not repeat what has failed.</text>

<!-- time axis -->
<line class="ax" x1="44" y1="70" x2="44" y2="592"></line>
<g class="ax"><line x1="34" y1="76" x2="44" y2="76"></line><line x1="34" y1="126" x2="44" y2="126"></line>
<line x1="34" y1="176" x2="44" y2="176"></line><line x1="34" y1="226" x2="44" y2="226"></line>
<line x1="34" y1="276" x2="44" y2="276"></line><line x1="34" y1="326" x2="44" y2="326"></line>
<line x1="34" y1="376" x2="44" y2="376"></line><line x1="34" y1="426" x2="44" y2="426"></line>
<line x1="34" y1="476" x2="44" y2="476"></line><line x1="34" y1="526" x2="44" y2="526"></line></g>
<text class="c" x="0" y="80">0:00</text><text class="c" x="0" y="130">0:30</text>
<text class="c" x="0" y="180">1:00</text><text class="c" x="0" y="230">1:30</text>
<text class="c" x="0" y="280">2:00</text><text class="c" x="0" y="330">2:30</text>
<text class="c" x="0" y="380">3:00</text><text class="c" x="0" y="430">3:30</text>
<text class="c" x="0" y="480">4:00</text><text class="c" x="0" y="530">4:30</text>
<!-- danger zone -->
<rect x="40" y="556" width="8" height="36" fill="#e84c4c" opacity="0.55"></rect>
<line x1="34" y1="576" x2="48" y2="576" stroke="#e84c4c" stroke-width="2"></line>
<text class="c" x="0" y="580" style="fill:#e84c4c">5:00</text>

<!-- rungs -->
<rect class="rung" x="56" y="76" width="264" height="42" rx="7" stroke="#00d4aa"></rect>
<text class="rn" x="68" y="95">CALL FOR HELP · START THE CLOCK</text>
<text class="c" x="68" y="110">Say “shoulder dystocia”. Stop pushing.</text>

<rect class="rung" x="56" y="126" width="264" height="42" rx="7" stroke="#00d4aa"></rect>
<text class="rn" x="68" y="145">McROBERTS</text>
<text class="c" x="68" y="160">Hyperflex hips. Rotates the symphysis.</text>

<rect class="rung" x="56" y="176" width="264" height="42" rx="7" stroke="#00d4aa"></rect>
<text class="rn" x="68" y="195">SUPRAPUBIC PRESSURE</text>
<text class="c" x="68" y="210">Down and toward the fetal chest.</text>

<rect class="rung" x="56" y="226" width="264" height="42" rx="7" stroke="#2563eb"></rect>
<text class="rn" x="68" y="245">EPISIOTOMY — if needed</text>
<text class="c" x="68" y="260">Room for your hand, not for the baby.</text>

<rect class="rung" x="56" y="276" width="264" height="42" rx="7" stroke="#2563eb"></rect>
<text class="rn" x="68" y="295">INTERNAL ROTATION</text>
<text class="c" x="68" y="310">Rubin II + Woods, turned as a screw.</text>

<rect class="rung" x="56" y="326" width="264" height="42" rx="7" stroke="#2563eb" stroke-width="3"></rect>
<text class="rn" x="68" y="345">POSTERIOR ARM</text>
<text class="c" x="68" y="360">Flex the elbow, sweep across the chest.</text>

<rect class="rung" x="56" y="376" width="264" height="42" rx="7" stroke="#2563eb"></rect>
<text class="rn" x="68" y="395">ALL FOURS (Gaskin)</text>
<text class="c" x="68" y="410">Quick, no kit. Maneuvers still work.</text>

<rect class="rung" x="56" y="426" width="264" height="42" rx="7" stroke="#f59e0b"></rect>
<text class="rn" x="68" y="445">LAST RESORTS</text>
<text class="c" x="68" y="460">Zavanelli · cleidotomy · symphysiotomy</text>

<text class="c" x="56" y="492">Failing once through is not failure — repeat it, with fresh hands.</text>

<!-- right column -->
<text class="s" x="336" y="86" style="fill:#f59e0b">pH FALLS 0.04/MIN</text>
<text class="c" x="336" y="102">from the moment the</text>
<text class="c" x="336" y="116">head delivers.</text>

<text class="s" x="336" y="150" style="fill:#e84c4c">NEVER FUNDAL</text>
<text class="c" x="336" y="166" style="fill:#e84c4c">It drives the shoulder</text>
<text class="c" x="336" y="180" style="fill:#e84c4c">harder onto the bone,</text>
<text class="c" x="336" y="194" style="fill:#e84c4c">and ruptures the uterus.</text>

<text class="s" x="336" y="228" style="fill:#e84c4c">NEVER PULL HARD</text>
<text class="c" x="336" y="244" style="fill:#e84c4c">Traction stretches the</text>
<text class="c" x="336" y="258" style="fill:#e84c4c">plexus. Axial only —</text>
<text class="c" x="336" y="272" style="fill:#e84c4c">and never twist the head.</text>

<text class="s" x="336" y="342" style="fill:#2563eb">HIGHEST YIELD</text>
<text class="c" x="336" y="358">Removing one arm cuts</text>
<text class="c" x="336" y="372">the shoulder diameter</text>
<text class="c" x="336" y="386">by about 20%.</text>
<text class="c" x="336" y="404" style="fill:#2563eb">A fracture here is an</text>
<text class="c" x="336" y="418" style="fill:#2563eb">acceptable price.</text>

<text class="s" x="56" y="560" style="fill:#e84c4c">PAST 5 MINUTES</text>
<text class="c" x="56" y="578">Risk of hypoxic-ischemic injury climbs steeply.</text>
<text class="c" x="56" y="594">Working the whole sequence once takes about four minutes.</text>
</svg>