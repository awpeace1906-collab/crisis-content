<svg viewBox="0 0 560 574" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anterior neck anatomy for front-of-neck airway. From top: hyoid bone, thyroid cartilage with its superior notch, the cricothyroid membrane in the gap below it, the cricoid cartilage ring, then the tracheal rings with the thyroid isthmus overlying the second and third. The cricothyroid membrane is the cricothyrotomy target; the second to third tracheal ring interspace is the tracheostomy target, with subglottic stenosis risk above it and the innominate artery below.">
<style>
  .cart{fill:#182030;stroke:#00d4aa;stroke-width:2.2}
  .ring{fill:#182030;stroke:#2563eb;stroke-width:2}
  .lbl{fill:#e8edf5;font-family:Syne,sans-serif;font-weight:700;font-size:14px}
  .sub{fill:#8a9ab5;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .warn{fill:#f59e0b;font-family:'IBM Plex Mono',monospace;font-size:11px}
  .dngr{fill:#e84c4c;font-family:'IBM Plex Mono',monospace;font-size:11px}
  .lead{stroke:#4a5670;stroke-width:1;stroke-dasharray:3 3}
  .ttl{fill:#e8edf5;font-family:Syne,sans-serif;font-weight:700;font-size:17px}
  .cap{fill:#4a5670;font-family:'IBM Plex Mono',monospace;font-size:11px}
</style>

<text class="ttl" x="0" y="17">Anterior neck — the landmarks you are feeling for</text>
<text class="cap" x="0" y="35">Laryngeal handshake: hyoid → thyroid cartilage → membrane → cricoid</text>

<!-- hyoid -->
<path d="M132,78 Q200,56 268,78" fill="none" stroke="#00d4aa" stroke-width="9" stroke-linecap="round" opacity="0.75"></path>
<line class="lead" x1="272" y1="72" x2="322" y2="66"></line>
<text class="lbl" x="328" y="70">Hyoid</text>

<!-- thyroid cartilage, with superior notch -->
<path class="cart" d="M200,120 L188,104 L146,114 L140,196 L200,210 L260,196 L254,114 L212,104 Z"></path>
<path d="M188,104 L200,120 L212,104" fill="none" stroke="#00d4aa" stroke-width="2.2"></path>
<line class="lead" x1="264" y1="150" x2="322" y2="140"></line>
<text class="lbl" x="328" y="138">Thyroid cartilage</text>
<text class="sub" x="328" y="156">notch at the top —</text>
<text class="sub" x="328" y="171">start the walk here</text>

<!-- cricothyroid membrane: the gap -->
<rect x="152" y="214" width="96" height="30" rx="8" fill="#e84c4c" opacity="0.2"></rect>
<rect x="152" y="214" width="96" height="30" rx="8" fill="none" stroke="#e84c4c" stroke-width="2.4"></rect>
<line class="lead" x1="252" y1="229" x2="322" y2="215"></line>
<text class="lbl" x="328" y="212" style="fill:#e84c4c">Cricothyroid membrane</text>
<text class="sub" x="328" y="230">~1 cm tall, 2–3 cm wide</text>
<text class="dngr" x="328" y="248">▸ CRICOTHYROTOMY TARGET</text>

<!-- cricoid -->
<rect class="cart" x="150" y="250" width="100" height="36" rx="13"></rect>
<line class="lead" x1="254" y1="268" x2="322" y2="276"></line>
<text class="lbl" x="328" y="280">Cricoid cartilage</text>
<text class="sub" x="328" y="297">the only complete ring</text>

<!-- tracheal rings -->
<rect class="ring" x="156" y="300" width="88" height="18" rx="9"></rect>
<rect class="ring" x="156" y="326" width="88" height="18" rx="9"></rect>
<rect class="ring" x="156" y="352" width="88" height="18" rx="9"></rect>
<rect class="ring" x="156" y="378" width="88" height="18" rx="9"></rect>
<rect class="ring" x="156" y="404" width="88" height="18" rx="9"></rect>
<text class="sub" x="126" y="313">1</text>
<text class="sub" x="126" y="339">2</text>
<text class="sub" x="126" y="365">3</text>
<text class="sub" x="126" y="391">4</text>

<!-- thyroid isthmus overlying rings 2-3 -->
<rect x="140" y="322" width="120" height="48" rx="12" fill="#a78bfa" opacity="0.18"></rect>
<line class="lead" x1="140" y1="346" x2="86" y2="346"></line>
<text class="sub" x="0" y="342" style="fill:#a78bfa">thyroid</text>
<text class="sub" x="0" y="357" style="fill:#a78bfa">isthmus</text>

<!-- tracheostomy window 2nd-3rd -->
<rect x="248" y="330" width="14" height="40" rx="4" fill="#f59e0b" opacity="0.35"></rect>
<line class="lead" x1="262" y1="350" x2="322" y2="344"></line>
<text class="lbl" x="328" y="342" style="fill:#f59e0b">2nd–3rd ring</text>
<text class="warn" x="328" y="360">▸ TRACHEOSTOMY TARGET</text>

<!-- danger annotations -->
<text class="dngr" x="328" y="392">Too high → subglottic stenosis</text>
<text class="dngr" x="328" y="409">Too low → innominate artery</text>

<!-- sternal notch -->
<path d="M120,470 Q200,452 280,470" fill="none" stroke="#4a5670" stroke-width="6" stroke-linecap="round"></path>
<line class="lead" x1="284" y1="464" x2="322" y2="458"></line>
<text class="sub" x="328" y="462">sternal notch</text>

<!-- incision guidance -->
<line x1="200" y1="112" x2="200" y2="240" stroke="#e8edf5" stroke-width="2" stroke-dasharray="6 5" opacity="0.5"></line>
<text class="cap" x="0" y="508">Vertical midline incision when landmarks are impalpable — the midline is</text>
<text class="cap" x="0" y="524">relatively avascular, extends in both directions, and lets you palpate inside</text>
<text class="cap" x="0" y="540">the wound. Transverse stab only when you can confidently feel the membrane.</text>
<text class="cap" x="0" y="564" style="fill:#8a9ab5">Schematic, not to scale. The membrane is smaller in women and in children.</text>
</svg>